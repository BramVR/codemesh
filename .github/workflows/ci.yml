name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unix-smoke:
    name: Test CodeMesh CLI (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Ubuntu
            artifact_os: ubuntu
            runner: ubuntu-latest
          - os_name: macOS
            artifact_os: macos
            runner: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run Go tests
        if: ${{ !cancelled() }}
        run: make test

      - name: Run e2e tests
        if: ${{ !cancelled() }}
        env:
          CODEMESH_E2E_REPORT: tmp/e2e-reports/${{ matrix.artifact_os }}/source.json
        run: make e2e

      - name: Run packaged e2e tests
        if: ${{ !cancelled() }}
        env:
          CODEMESH_E2E_REPORT: tmp/e2e-reports/${{ matrix.artifact_os }}/packaged.json
        run: make e2e-packaged

      - name: Summarize e2e artifacts
        if: ${{ always() }}
        run: |
          echo "artifact: codemesh-e2e-${{ matrix.artifact_os }}-source"
          echo "report: tmp/e2e-reports/${{ matrix.artifact_os }}/source.json"
          echo "os: $RUNNER_OS"
          echo "arch: $RUNNER_ARCH"
          go version || true
          echo "artifact: codemesh-e2e-${{ matrix.artifact_os }}-packaged"
          echo "report: tmp/e2e-reports/${{ matrix.artifact_os }}/packaged.json"
          echo "os: $RUNNER_OS"
          echo "arch: $RUNNER_ARCH"
          go version || true

      - name: Upload source e2e report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codemesh-e2e-${{ matrix.artifact_os }}-source
          path: tmp/e2e-reports/${{ matrix.artifact_os }}/source.json
          if-no-files-found: warn
          retention-days: 5

      - name: Upload packaged e2e report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codemesh-e2e-${{ matrix.artifact_os }}-packaged
          path: tmp/e2e-reports/${{ matrix.artifact_os }}/packaged.json
          if-no-files-found: warn
          retention-days: 5

  windows-smoke:
    name: Test CodeMesh CLI (Windows smoke)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run Windows config unit smoke
        run: go test ./internal/config

      - name: Run Windows e2e report unit smoke
        run: go test ./test/e2e -run "TestWriteReportIncludesAuditMetadataSummaryAndSecretSafety|TestWriteReportDistinguishesPackagedBinary|TestLiveOptInParsing|TestTimeoutTiers"

      - name: Build Windows CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -o dist/codemesh.exe ./cmd/codemesh

      - name: Smoke Windows binary
        shell: pwsh
        run: .\dist\codemesh.exe --help

      - name: Record Windows e2e scope
        if: ${{ always() }}
        shell: pwsh
        run: |
          "windows_smoke: targeted Go unit smoke + go build + binary help"
          "windows_e2e: tracked skip for https://github.com/BramVR/codemesh/issues/92; source and packaged e2e report artifacts run on Ubuntu/macOS"
          "live_network_peekaboo: not part of required PR CI"
